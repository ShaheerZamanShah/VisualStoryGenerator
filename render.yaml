# Render Blueprint — FREE tier ($0/month)
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo
#
# Free tier limits:
#   - Backend sleeps after 15 min inactivity (~30s cold start)
#   - 512 MB RAM — video generation may fail or timeout on heavy jobs
#   - No persistent disk — generated videos are lost on restart/redeploy
#   - Static frontend is always free with no sleep

services:
  # ── Backend API (Docker) — FREE ───────────────────────────────────────
  - type: web
    name: visualstory-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TTS_ENGINE
        value: edge_tts
      - key: CLOUD_MODE
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: visualstory-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend (Static Site) — FREE ─────────────────────────────────────
  - type: web
    name: visualstory-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: visualstory-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
